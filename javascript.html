<!DOCTYPE html>
<html>
<head>
    <title>User Registration Form</title>
    <style>
        .error { color: red; font-size: 12px; }
        input { margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>User Registration Form</h2>

<form name="regForm" onsubmit="return validateForm()">
    
    Name: <input type="text" id="name">
    <span id="nameError" class="error"></span> <br>

    Email: <input type="text" id="email">
    <span id="emailError" class="error"></span> <br>

    Password: <input type="password" id="password">
    <span id="passError" class="error"></span> <br>

    Age: <input type="text" id="age">
    <span id="ageError" class="error"></span> <br>

    Mobile: <input type="text" id="mobile">
    <span id="mobileError" class="error"></span> <br>

    <input type="submit" value="Submit">
</form>

<script>
function validateForm() {
   
    document.getElementById("nameError").innerHTML = "";
    document.getElementById("emailError").innerHTML = "";
    document.getElementById("passError").innerHTML = "";
    document.getElementById("ageError").innerHTML = "";
    document.getElementById("mobileError").innerHTML = "";
   
   let name = document.getElementById("name").value;
    let nameRegex = /^[A-Za-z\s]+$/;
    if(name == "") {
        alert("Name is required");
        return false;
    } else if(!nameRegex.test(name)) {
        alert("Name: Only characters and spaces allowed");
        return false;
    }

    let email = document.getElementById("email").value;
    let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(email == "") {
        alert("Email is required");
        return false;
    } else if(!emailRegex.test(email)) {
        alert("Email: Invalid email format. Ex: abc@gmail.com");
        return false;
    }

     let password = document.getElementById("password").value;
    let passRegex = /^\d{6}$/; // 6 digits only
    if(password == "") {
        alert("Password is required");
        return false;
    } else if(!passRegex.test(password)) {
        alert("Password: Must be exactly 6 digits");
        return false;
    }

     let age = document.getElementById("age").value;
    let ageRegex = /^\d+$/;
    if(age == "") {
        alert("Age is required");
        return false;
    } else if(!ageRegex.test(age)) {
        alert("Age: Only numbers allowed");
        return false;
    }

     let mobile = document.getElementById("mobile").value;
    let mobileRegex = /^\d{10}$/;
    if(mobile == "") {
        alert("Mobile is required");
        return false;
    } else if(!mobileRegex.test(mobile)) {
        alert("Mobile: Must be exactly 10 digits");
        return false;
    }

    alert("Form submitted successfully!");
    return true; 
}
</script>

</body>
</html>
